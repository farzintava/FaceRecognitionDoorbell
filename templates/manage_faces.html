<table class="table">
    <thead>
        <tr>
            <th>Name</th>
            <th>Picture</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for face in known_faces %}
        <tr>
            <td>{{ face.name }}</td>
            <td><img src="{{ url_for('static', filename='/data/known_faces/'+face.image_path) }}" alt="{{ face.name }}"></td>
            <td><a href="{{ url_for('delete_face', face_id=face.id) }}">Delete</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
